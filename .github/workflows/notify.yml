name: Check Upcoming Lessons

on:
  schedule:
    - cron: '0 2 * * 1-5'
    - cron: '*/5 3-13 * * 1-5'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Run Notifier
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: node notifier.js
        
