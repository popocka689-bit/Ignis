name: Morning Digest Notifier

on:
  schedule:
    # Запуски с нестандартными минутами (в обход перегруженных очередей GitHub Actions :00, :15, :30, :45)
    # Время в UTC. Для часового пояса +05:00:
    - cron: '4 1 * * 1-5'    # ~06:04 (+05:00)
    - cron: '19 1 * * 1-5'   # ~06:19 (+05:00)
    - cron: '34 1 * * 1-5'   # ~06:34 (+05:00)
    - cron: '49 1 * * 1-5'   # ~06:49 (+05:00)
    - cron: '9 2 * * 1-5'    # ~07:09 (+05:00)
    - cron: '24 2 * * 1-5'   # ~07:24 (+05:00)
    - cron: '44 2 * * 1-5'   # ~07:44 (+05:00)
    - cron: '14 3 * * 1-5'   # ~08:14 (+05:00)
    - cron: '44 3 * * 1-5'   # ~08:44 (+05:00)
    - cron: '14 4 * * 1-5'   # ~09:14 (+05:00)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Notifier
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node notifier.js
